# =============================================================================
# ashare-quant 全局配置
# =============================================================================
# 注意：tushare_token 等敏感字段建议放到 config/secrets.yaml（已被 .gitignore）
# 也可通过环境变量 TUSHARE_TOKEN 覆盖
# =============================================================================

project:
  name: ashare-quant
  timezone: Asia/Shanghai
  base_currency: CNY

# -------------------------- MySQL 存储 --------------------------
# 所有持久化数据 (行情 / 因子 / 策略 / 回测 / 模拟盘 / 实盘 / 报告) 全部走 MySQL
# 也可通过环境变量 ASHARE_MYSQL_URL 完全覆盖（最高优先级）
mysql:
  host: 127.0.0.1
  port: 3306
  user: root
  password: "123456"        # 建议生产放 config/secrets.yaml 或 ASHARE_MYSQL_PASSWORD
  database: ashare_quant
  charset: utf8mb4
  pool_size: 10
  pool_recycle: 3600
  # 启动时如果 database 不存在自动创建
  auto_create_database: true

# -------------------------- API 服务 --------------------------
api:
  host: 0.0.0.0
  port: 8000
  auto_init_db: true        # 启动时自动 create_all + seed
  cors_origins: ["*"]

# -------------------------- 数据 --------------------------
data:
  # 数据源优先级（自动 fallback）：akshare -> efinance -> tushare
  sources: [akshare, efinance, tushare]
  tushare_token: ""        # 也可读环境变量 TUSHARE_TOKEN
  # storage_root 已废弃，全部落 MySQL；保留只为兼容旧 ingest 代码
  storage_root: ./data_warehouse
  # 历史数据起点（首次初始化）
  history_start: 2018-01-01
  # 增量更新（每个交易日盘后）
  daily_update_time: "17:30"
  # 是否包含 ST / *ST / 退市股票（回测要包含才公允）
  include_st: true
  # 复权方式：none | qfq | hfq （建议因子用 qfq，PnL 用 hfq）
  default_adjust: qfq

# -------------------------- 宇宙（股票池） --------------------------
universe:
  # 候选：all | hs300 | zz500 | zz800 | zz1000 | sw_industry:<code>
  default: hs300
  # 过滤规则
  filters:
    drop_st: true
    drop_suspended: true
    drop_new_days: 60        # 上市未满 60 日不入池
    min_price: 1.0
    min_market_cap: 2e9      # 20 亿市值下限
    min_avg_turnover_20d: 1e7  # 20 日均换手金额下限

# -------------------------- 风控 --------------------------
risk:
  # 单票上限（占组合权重）
  max_position_per_stock: 0.05
  # 单行业上限
  max_industry_exposure: 0.30
  # 组合最大回撤熔断
  max_drawdown_stop: 0.15
  # 单日亏损熔断
  daily_loss_stop: 0.05
  # 个股止损
  stock_stop_loss: 0.10
  stock_take_profit: 0.30
  # 流动性约束：单笔交易不超过当日成交量的
  liquidity_limit: 0.05

# -------------------------- 经纪商/费用 --------------------------
broker:
  mode: sim   # sim | qmt | ctp
  # 双向佣金（万 2.5），最低 5 元
  commission_rate: 0.00025
  commission_min: 5.0
  # 卖出印花税（千一）
  stamp_duty: 0.001
  # 沪市过户费（万 0.1，2023 年起双向）
  transfer_fee: 0.00001
  # 滑点
  slippage_bps: 5   # 5 bp = 0.05%

# -------------------------- 回测 --------------------------
backtest:
  start: 2020-01-01
  end: 2024-12-31
  initial_cash: 1000000
  benchmark: "000300.SH"
  rebalance_freq: "M"        # D / W / M / Q
  # 撮合价：open | close | vwap | next_open
  trade_price: next_open
  # IS/OOS 切分点
  oos_start: 2023-01-01

# -------------------------- 实盘 --------------------------
live:
  # 仅在 mode=qmt 时生效
  qmt_path: "C:/迅投QMT/userdata_mini"
  account_id: ""
  account_type: "STOCK"
  # 报警通道
  alert:
    enabled: false
    wechat_work_webhook: ""
    dingtalk_webhook: ""
    email:
      smtp_server: ""
      smtp_port: 465
      sender: ""
      password: ""
      receivers: []

# -------------------------- 日志 --------------------------
logging:
  level: INFO
  dir: ./logs
  rotation: "100 MB"
  retention: "30 days"
  # API 服务 Uvicorn 访问/服务日志（api_access.log / api_server.log）滚动大小与份数，可选
  # uvicorn_max_bytes: 104857600
  # uvicorn_backup_count: 5
